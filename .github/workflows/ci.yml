name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    # Liquid Glass APIs need the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Unit tests
        run: swift test
      - name: Release build (universal)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Helpers
        run: |
          clang -dynamiclib -fobjc-arc -O2 -arch arm64 -arch x86_64 -mmacosx-version-min=14.0 -framework Foundation Helpers/NowPlaying.m -o /tmp/LumoNowPlaying.dylib
          clang -O2 -Wall -arch arm64 -arch x86_64 -mmacosx-version-min=14.0 -framework IOKit -framework CoreFoundation Helpers/FanHelper.c -o /tmp/lumo-fan
